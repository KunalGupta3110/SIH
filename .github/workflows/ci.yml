name: IBVAP CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax & Compilation Validation
      run: |
        python -m py_compile alerts/*.py reid/*.py detection_tracking/*.py dashboard/*.py backend/*.py

    - name: Verify Schema and Database Initialization
      run: |
        python -c "from alerts.events import EventDatabase; db = EventDatabase('data/test_events.db'); print('Event DB Initialized OK')"
        python -c "from alerts.schema import SecurityEvent, AlertSeverity, AlertType, OperatorStatus; print('Schema OK')"
