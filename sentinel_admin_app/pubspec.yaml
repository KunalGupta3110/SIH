name: sentinel_admin_app
description: >
  Administrator Control App for the Next-Gen AI Edge Security & Safety
  Ecosystem. Monitors edge node status, arms/disarms zones, reviews the
  incident timeline (intruders, smoke, fire), and enrolls authorized faces.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Routing ---
  go_router: ^14.2.0

  # --- Networking ---
  dio: ^5.4.3+1

  # --- Push notifications ---
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

  # --- Camera / image capture for face enrollment ---
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # --- Media loading (S3 thumbnails) ---
  cached_network_image: ^3.3.1

  # --- Utilities ---
  intl: ^0.19.0
  equatable: ^2.0.5
  flutter_svg: ^2.0.10+1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Custom fonts (uncomment once font files are placed in assets/fonts/):
  # fonts:
  #   - family: SpaceGrotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Regular.ttf
